name: Build

on:
  push:
    branches: [chromatic]
  pull_request:
    branches: [chromatic]
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache
          actions-cache-key: ci
          package-cache: true
          package-cache-key: windows-2025

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: xmake config -v --yes --toolchain=clang-cl --mode=releasedbg

      - name: Build
        run: xmake build --yes --verbose

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-windows-x64-${{ github.sha }}
          path: build/windows/x64/releasedbg/
          retention-days: 30

      - name: Create release archives
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/releasedbg/* -DestinationPath chromatic-windows-x64-pdb.zip
          $staging = "release-staging"
          New-Item -ItemType Directory -Path $staging
          Get-ChildItem build/windows/x64/releasedbg/* -Exclude *.pdb,*.lib | Copy-Item -Destination $staging
          Compress-Archive -Path $staging/* -DestinationPath chromatic-windows-x64.zip

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chromatic-windows-x64.zip
            chromatic-windows-x64-pdb.zip
