name: Build

on:
  push:
    branches: [chromatic]
  pull_request:
    branches: [chromatic]
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [x64, x86]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache
          actions-cache-key: ci-${{ matrix.arch }}
          package-cache: true
          package-cache-key: windows-2025-${{ matrix.arch }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Configure
        run: xmake config -v --yes --toolchain=clang-cl --mode=releasedbg --arch=${{ matrix.arch }}

      - name: Build
        run: xmake build --yes --verbose

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-windows-${{ matrix.arch }}-${{ github.sha }}
          path: build/windows/${{ matrix.arch }}/releasedbg/
          retention-days: 30

      - name: Create release archives
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/${{ matrix.arch }}/releasedbg/* -DestinationPath chromatic-windows-${{ matrix.arch }}-pdb.zip
          $staging = "release-staging"
          New-Item -ItemType Directory -Path $staging
          Get-ChildItem build/windows/${{ matrix.arch }}/releasedbg/* -Exclude *.pdb,*.lib | Copy-Item -Destination $staging
          Compress-Archive -Path $staging/* -DestinationPath chromatic-windows-${{ matrix.arch }}.zip

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chromatic-windows-${{ matrix.arch }}.zip
            chromatic-windows-${{ matrix.arch }}-pdb.zip
